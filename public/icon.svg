<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Subtle concentric architectural rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#93C5FD" stroke-opacity="0.14" stroke-width="2" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="#93C5FD" stroke-opacity="0.18" stroke-width="2" />
  <!-- Neural network synaptic connections (3 -> 4 -> 2 -> 1 emblem) -->
  <g stroke="#93C5FD" stroke-opacity="0.58" stroke-width="6" stroke-linecap="round">
    <!-- Input to Hidden 1 -->
    <line x1="128" y1="168" x2="232" y2="128" />
    <line x1="128" y1="168" x2="232" y2="214" />
    <line x1="128" y1="168" x2="232" y2="298" />
    <line x1="128" y1="256" x2="232" y2="128" />
    <line x1="128" y1="256" x2="232" y2="214" />
    <line x1="128" y1="256" x2="232" y2="298" />
    <line x1="128" y1="256" x2="232" y2="384" />
    <line x1="128" y1="344" x2="232" y2="214" />
    <line x1="128" y1="344" x2="232" y2="298" />
    <line x1="128" y1="344" x2="232" y2="384" />
    <!-- Hidden 1 to Hidden 2 -->
    <line x1="232" y1="128" x2="328" y2="196" />
    <line x1="232" y1="214" x2="328" y2="196" />
    <line x1="232" y1="214" x2="328" y2="316" />
    <line x1="232" y1="298" x2="328" y2="196" />
    <line x1="232" y1="298" x2="328" y2="316" />
    <line x1="232" y1="384" x2="328" y2="316" />
    <!-- Hidden 2 to Output -->
    <line x1="328" y1="196" x2="404" y2="256" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="8" />
    <line x1="328" y1="316" x2="404" y2="256" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="8" />
  </g>
  <!-- Input Layer Nodes -->
  <circle cx="128" cy="168" r="20" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="4" />
  <circle cx="128" cy="256" r="20" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="4" />
  <circle cx="128" cy="344" r="20" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="4" />
  <!-- Hidden Layer 1 Nodes -->
  <circle cx="232" cy="128" r="20" fill="url(#nodeGlow)" stroke="#1E3A8A" stroke-width="4" />
  <circle cx="232" cy="214" r="20" fill="url(#nodeGlow)" stroke="#1E3A8A" stroke-width="4" />
  <circle cx="232" cy="298" r="20" fill="url(#nodeGlow)" stroke="#1E3A8A" stroke-width="4" />
  <circle cx="232" cy="384" r="20" fill="url(#nodeGlow)" stroke="#1E3A8A" stroke-width="4" />
  <!-- Hidden Layer 2 Nodes -->
  <circle cx="328" cy="196" r="22" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="5" />
  <circle cx="328" cy="316" r="22" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="5" />
  <!-- Output Prediction Node -->
  <circle cx="404" cy="256" r="30" fill="#34D399" stroke="#FFFFFF" stroke-width="7" />
</svg>
